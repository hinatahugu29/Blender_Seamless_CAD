site_name: Seamless CAD
site_description: Non-destructive CAD modelling inside Blender
site_url: https://hinatahugu29.github.io/Blender_Seamless_CAD/
repo_url: https://github.com/hinatahugu29/Blender_Seamless_CAD
repo_name: hinatahugu29/Blender_Seamless_CAD
copyright: GPL-2.0-or-later

docs_dir: docs

# これらは GitHub 上でリポジトリを見る人のための文書で、サイトのページではない。
exclude_docs: |
  README.md
  CONTRIBUTING.md

theme:
  name: material
  language: en
  features:
    # navigation.instant は入れないこと。mkdocs-static-i18n の言語切替リンクが
    # 機能しなくなる（ビルド時に警告が出る）。
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list      # 用語集 (glossary.md) の定義リストに必要
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys

plugins:
  - search
  - i18n:
      docs_structure: folder
      # ru / zh に英語ページを埋めない。ナビに無いページが生えて、ロシア語サイトの
      # /ru/concepts/ が英語で出てくるのを避けるため。翻訳の範囲は明示的に保つ。
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          nav:
            - Home: index.md
            - Getting started:
                - Installation: install.md
                - Quick Start: quickstart.md
            - How to:
                - Turn a sketch into a solid: howto-sketch-to-solid.md
                - Cut holes and pockets: howto-holes.md
                - Exchange files with other CAD: howto-cad-exchange.md
            - Reference:
                - The Feature Tree and parts: feature-tree.md
                - Modelling operations: modeling.md
                - Sketching: sketching.md
                - Keyboard and mouse: shortcuts.md
                - Quality and performance: quality.md
                - Import and export: import-export.md
            - Background and limits:
                - How it works: concepts.md
                - Known limitations: limitations.md
                - Troubleshooting: troubleshooting.md
                - macOS / Linux testing builds: testing-builds.md
            - Resources:
                - FAQ: faq.md
                - Glossary: glossary.md

        - locale: ja
          name: 日本語
          build: true
          nav:
            - ホーム: index.md
            - はじめに:
                - インストール: install.md
                - クイックスタート: quickstart.md
            - 使い方:
                - スケッチから立体を作る: howto-sketch-to-solid.md
                - 穴とポケットを開ける: howto-holes.md
                - 他の CAD とファイルをやりとりする: howto-cad-exchange.md
            - リファレンス:
                - Feature Tree と Part: feature-tree.md
                - モデリング操作: modeling.md
                - スケッチ: sketching.md
                - キーボードとマウス: shortcuts.md
                - 品質とパフォーマンス: quality.md
                - 読み込みと書き出し: import-export.md
            - 仕組みと制約:
                - 仕組み: concepts.md
                - 既知の制約: limitations.md
                - 困ったとき: troubleshooting.md
                - macOS / Linux テストビルド: testing-builds.md
            - 資料:
                - よくある質問: faq.md
                - 用語集: glossary.md

        # ru / zh はクイックスタートのみ。範囲を広げる場合は docs/CONTRIBUTING.md を読むこと。
        - locale: ru
          name: Русский
          build: true
          nav:
            - Главная: index.md
            - Быстрый старт: quickstart.md

        - locale: zh
          name: 中文
          build: true
          nav:
            - 首页: index.md
            - 快速入门: quickstart.md
