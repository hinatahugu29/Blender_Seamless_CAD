[package]
name = "seamless_core"
version = "1.7.0"
edition = "2021"

[lib]
name = "seamless_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cad_server"
path = "src/main.rs"


[dependencies]
cpp = "0.5"
once_cell = "1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ezpz = { git = "https://github.com/KittyCAD/ezpz.git", rev = "df5edd1d77d39c1ec29a79bf3c9c5321f227b854" }
rayon = "1.8"
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"
memmap2 = "0.9"

[build-dependencies]
cpp_build = "0.5"
cc = "1.0"
[profile.dev]
opt-level = 0
debug = 0
split-debuginfo = "off"
codegen-units = 1
incremental = false

