# カーネルをビルドする rustc を固定する。
#
# なぜ要るか (2026-09-14 に実測):
#   8.1.5.12 と 8.1.5.15 の Linux 版 cad_server は、カーネルのソースを1行も
#   変えていないのに 1,456 バイト違っていた (11,941,288 → 11,942,744)。
#   両者のバイナリを比較したところ、差は rustc のソースパスハッシュだけで
#   (88d9e12a… → 48a229ce…)、C++ 側は同一 (GCC 11.4.0 Ubuntu 22.04)。
#   CI にツールチェーンの指定が無く、GitHub ランナー同梱の rustc が
#   勝手に上がっていた。
#
# なぜ困るか:
#   「利用者が動かしているカーネルはどの版か」を今はファイルサイズでしか
#   判定できない (core_bridge.py が起動時にサイズと mtime をログへ書く)。
#   2026-09 の Face Inset 報告では、報告者に「11,941,288 バイトになるはず」と
#   伝えて版の取り違えを潰した。ソースを変えずにサイズが動くなら、その証拠が
#   使えなくなる。
#
# 1.98.1 を選んだ理由:
#   これが 8.1.5.15 を実際にビルドした版 (commit 48a229cea)。ここに固定すると
#   現在配布しているバイナリと一致したままになる。上げるときは意識して上げ、
#   3プラットフォームを作り直すこと。
[toolchain]
channel = "1.98.1"
profile = "minimal"
