name: Build cad_server for macOS and Linux

# 幾何カーネル(cad_server)を macOS / Linux 向けにビルドし、
# Blender にそのまま入れられる ZIP を artifact として出す。
#
# ソースは Blender_CAD_V_8_1_5_1/ の1本だけ。OS 分岐は core_bridge.py /
# build.rs / package_addon.py の中にあり、build_cad_addon.sh が uname で
# 対象を判定する。プラットフォーム別の複製フォルダは作らないこと
# (理由は Blender_CAD_V_8_1_5_1/PORTING.md)。
#
# OCCT は conda-forge から取る。公式 dev.opencascade.org のプリビルドは
# Windows 専用で、Ubuntu の apt にあるものは 7.5/7.6 と古く TKDESTEP
# (7.8 で TKSTEP から改名)が無いためリンクできない。conda-forge だけが
# 3 OS すべてを 8.0.0 で揃えられる。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cross-platform.yml'
      - 'Blender_CAD_V_8_1_5_1/**'

env:
  OCCT_VERSION: "8.0.0"

defaults:
  run:
    working-directory: Blender_CAD_V_8_1_5_1

jobs:
  build:
    strategy:
      # 片方が落ちてももう片方の結果は見たい。移植中は両 OS の
      # 失敗内容を並べて比較できることに意味がある。
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest / 24.04 でビルドすると glibc の要求バージョンが上がり、
          # 古い環境で GLIBC_2.xx not found になる。22.04 を明示する。
          # (廃止済みの 20.04 を指定すると割り当て待ちのままフリーズするので使わない。)
          - os: ubuntu-22.04
            name: LINUX
          # Apple Silicon。Intel Mac 向けが必要になったら macos-13 を足す。
          - os: macos-14
            name: MAC

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux only)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Blender_CAD_V_8_1_5_1/src_rust

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: occt
          create-args: >-
            occt=${{ env.OCCT_VERSION }}
          condarc: |
            channels:
              - conda-forge

      - name: Build and package
        shell: bash -el {0}
        run: |
          # setup-micromamba が env を activate 済みなので CONDA_PREFIX が使える。
          # 万一 activate されていなければ root prefix から組み立てる。
          export OCCT_ROOT="${CONDA_PREFIX:-$MAMBA_ROOT_PREFIX/envs/occt}"
          echo "OCCT_ROOT=$OCCT_ROOT"
          ls "$OCCT_ROOT/lib" | head -20 || true
          chmod +x build_cad_addon.sh
          ./build_cad_addon.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CAD_${{ matrix.name }}
          path: Blender_CAD_V_8_1_5_1/*.zip
          if-no-files-found: error

# 配布時の注意:
# Actions の artifact をダウンロードすると、GitHub の仕様で ZIP の中に
# 本物のアドオン ZIP が入った二重 ZIP になる。必ず一度解凍し、中の
# CAD_<version>_install.zip を取り出して配布すること。
# 二重のまま配ると購入者側で構造エラーになる。
